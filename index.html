<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Une sélection de dépôts GitHub favoris.">
    <link rel="stylesheet" href="./style.css">
    <title>Mes dépôts favoris</title>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <p class="eyebrow">Ma sélection GitHub</p>
            <h1>Mes dépôts favoris</h1>
            <p>Des projets que je garde à portée de main.</p>
        </header>

        <section aria-labelledby="repositories-heading">
            <h2 id="repositories-heading">Dépôts enregistrés</h2>
            <p id="status" class="status" role="status" aria-live="polite">Chargement des dépôts…</p>
            <ul id="repository-list" class="repository-list" aria-describedby="status"></ul>
        </section>
    </main>
    <script src="./script.js" defer></script>
</body>
</html>
